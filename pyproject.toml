[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Trading bot for Claude code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only research/ needs these; the package itself stays dependency-free.
research = ["arch>=6.0"]
# The order proofreader. Optional on purpose: nothing in the trading path
# depends on it, and without it the loop behaves exactly as it did before.
review = ["anthropic>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
