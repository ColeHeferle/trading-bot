name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand from the Actions tab, or with
  # `gh workflow run ci.yml --ref <branch>`. GitHub only offers this once the
  # workflow file exists on the default branch, so it stays unavailable until
  # this merges to main.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        run: pytest
