name: Daily

# Runs the paper loop on GitHub's machines rather than yours: fetch the day's
# bar, advance the frozen run, commit both back, and report what the broker
# leg would do.
#
# It NEVER places an order. The broker step is a dry run with no way to pass
# --execute, because a schedule nobody is watching is the wrong place to
# decide to trade. Wiring execution in is a separate, deliberate change.
#
# Stooq refuses GitHub runners — measured, not assumed: the first run here got
# HTTP 404 for a URL that answers fine from a home connection, which is how
# some sites decline a cloud IP range without saying so. yfinance is therefore
# the default. Stooq stays selectable in case that changes.

on:
  schedule:
    # 22:00 UTC on weekdays — comfortably after the 16:00 ET close in either
    # daylight or standard time. GitHub runs scheduled jobs late when it is
    # busy, sometimes by tens of minutes; harmless for a rule that acts on
    # closes.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      source:
        description: "Data source"
        type: choice
        options: [yfinance, stooq]
        default: yfinance

# Two runs committing to main at once would race. Queue instead, and never
# cancel one partway: a fetch that is killed after writing the CSV but before
# advancing the run leaves the two files disagreeing.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  STATE: paper/qqq_sma_10_50_vol25.json
  BARS: paper/qqq_bars.csv
  SYMBOL: QQQ

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not readable from a step's `if:`, so fold it down to a
      # plain string here. This is the whole reason the broker step can be
      # skipped rather than failing on empty credentials.
      HAS_KEYS: ${{ secrets.APCA_API_KEY_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ inputs.source || 'yfinance' }}" = "yfinance" ]; then
            pip install yfinance
          fi

      - name: Fetch the day's bar
        run: |
          bash .github/report.sh '## Fetch' python research/fetch_bars.py \
            --out "$BARS" --source "${{ inputs.source || 'yfinance' }}"

      - name: Advance the paper run
        run: bash .github/report.sh '## Paper run' python research/paper_trade.py "$STATE" "$BARS"

      - name: Commit the day's data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BARS" "$STATE"
          if git diff --cached --quiet; then
            echo "nothing changed — a holiday, or the bar was already recorded"
            exit 0
          fi
          git commit -m "Record $(date -u +%Y-%m-%d) bar and advance the run"
          # Commit back to whichever ref was checked out, never a hardcoded
          # main. The schedule runs on main so nothing changes there, but a
          # hardcoded target meant dispatching this from a branch would push
          # that branch's whole content onto main — a bad way to find out.
          git pull --rebase origin "$REF"
          git push origin "HEAD:$REF"
        env:
          REF: ${{ github.ref_name }}

      - name: What the rule opens with
        # Exits 1 on anything it wants a human to look at, which is a report
        # here rather than a failure — the run already happened.
        continue-on-error: true
        run: bash .github/report.sh '## Preflight' python research/preflight.py "$STATE" "$BARS"

      - name: What the broker leg would do
        # Skipped entirely until the paper keys exist as repository secrets.
        # Dry run: there is no --execute here, by design.
        if: ${{ env.HAS_KEYS == 'true' }}
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: bash .github/report.sh '## Broker (dry run)' python research/trade.py --symbol "$SYMBOL"

      - name: Why the broker leg was skipped
        # A missing secret and a deliberate "not configured yet" looked
        # identical — both just a skipped step — which cost three runs to tell
        # apart. Actions keeps secrets and variables in separate stores with
        # the same names available, so the most useful thing this can say is
        # which store the name is actually in.
        if: ${{ env.HAS_KEYS != 'true' }}
        env:
          AS_VARIABLE: ${{ vars.APCA_API_KEY_ID != '' }}
        run: |
          {
            echo '## Broker leg skipped'
            echo
            if [ "$AS_VARIABLE" = "true" ]; then
              echo 'APCA_API_KEY_ID is set as a **variable**, not a secret.'
              echo
              echo 'Actions keeps these in separate stores. `secrets.X` cannot'
              echo 'read a variable, so the broker step has nothing to'
              echo 'authenticate with. Settings -> Secrets and variables ->'
              echo 'Actions -> **Secrets** tab -> New repository secret.'
            else
              echo 'APCA_API_KEY_ID is empty as both a secret and a variable,'
              echo 'so nothing by that name is reaching this workflow.'
              echo
              echo 'Check, in order: the name matches exactly (not'
              echo 'ALPACA_API_KEY_ID, no hyphens, no trailing space); it is a'
              echo '**Repository** secret rather than an **Environment** one,'
              echo 'which this job would need to declare to see; and it is'
              echo 'under the Actions tab rather than Codespaces or Dependabot.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
